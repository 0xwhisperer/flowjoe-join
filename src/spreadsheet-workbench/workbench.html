<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="../workbench-frameguard.1333444aee016d0b.js"></script>
    <!--
      Spreadsheet Workbench island (shipped — the app opens this page in the preview
      modal/fullscreen host).

      This is an ISOLATED same-origin document hosted inside an <iframe> by the main app.
      Univer (React + RxJS + its own CSS + formula engine) lives ONLY here, so:
        - Univer globals / CSS never enter FlowJoe's main renderer.
        - Keyboard events do not cross the frame boundary into the tree/gallery handlers.
        - Teardown = the parent removes the iframe node (no lingering React tree / listeners).
        - This document's CSP is independent of the main app's, so the 'unsafe-eval' the
          formula engine may need is CONTAINED here and the main app CSP stays hardened.

      The parent talks to this island via postMessage only — see src/js/spreadsheets/spreadsheetWorkbench.js.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:;
      style-src 'self' 'unsafe-inline';
      font-src 'self' data:;
      img-src 'self' data: blob:;
      connect-src 'self' blob: data:;
      worker-src 'self' blob:;" />
    <title>FlowJoe Spreadsheet Workbench</title>

    <!-- Univer stylesheet (built into src/vendor by scripts/build-univer-islands.js via vendor-workbench-deps.js). -->
    <link rel="stylesheet" href="../vendor/univer-sheets.bundle.css" />
    <link rel="stylesheet" href="./workbench.css" />
  </head>
  <body>
    <div id="fj-sheet-root"></div>

    <!--
      One self-contained bundle (React, ReactDOM, RxJS, Univer core/facade/design/render, preset-sheets-core and
      its en-US locale) that publishes the UniverPresets / UniverCore / UniverPresetSheetsCore[EnUS] globals and
      UniverEngineVersion, then our island controller. Built by scripts/build-univer-islands.js.
      echarts is intentionally omitted — preset-sheets-core (non-Pro core) does not use it.
    -->
    <script src="../vendor/univer-sheets.bundle.js"></script>
    <script src="./workbench.js"></script>
  </body>
</html>
