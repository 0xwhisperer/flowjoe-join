  FlowJoe app snapshot for browser-collaboration-presence.html (design mockup only).

  This is the REAL FlowJoe renderer DOM, frozen: the app was run from this repo
  (index.html + bundle/bundle.esm.js, commit 735de73fc), a sample Flow
  "Coastal Restoration Plan" was loaded, the node "Restoration notes" was selected,
  and the top bar, app rail, tree, gallery canvas and status footer were captured
  with scripts removed. The JS-generated <style> blocks the app injects at runtime
  (canvas gallery, linked files) are captured too; every other style comes from the
  real stylesheets the mockup links from src/css. Asset paths are rewritten to
  /src/.

  guest view (hides owner/Electron-only controls, adds presence pieces). Regenerate it
  from the running app if the real UI changes.
