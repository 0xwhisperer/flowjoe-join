<template id="snap-modal-flow-summary">
  <div id="image-modal" data-ai-font-size="normal" data-markdown-editor-shell-bound="1" data-modal-layout-reset-bound="1" data-summary-mode-active="true" data-initialized="1" data-preview-resize-bound="1" data-sound-bound="1" class="stm-1">
    <div id="image-modal-content" data-fullscreen="false" data-resize-handles-bound="1" class="stm-2">
      
      
      
      
      
      
      
      
      <div id="image-modal-titlebar" data-flowjoe-drag-bound="1" data-drag-bound="1" data-recenter-bound="1" class="floating-surface-drag-handle stm-3">
        <div class="stm-4">
          <span id="image-modal-heading" class="stm-5">Flow Summary</span>
          
        </div>
        
        
        <div id="image-modal-window-controls" class="stm-6">
          
          
          
          
          
          
          <button id="image-modal-close" aria-label="Close preview" class="flowjoe-modal-control-btn stm-7">×</button>
        </div>
      </div>

      <!-- Content area -->
      <div id="image-modal-body" class="stm-8">
        <!-- Image and notes in a flex container -->
        <div id="image-modal-layout-row" class="stm-9">
          <!-- Left: Image container with relative positioning -->
          

          <!-- Right: Notes container -->
          <div id="notes-container" class="image-notes-column stm-10">
            
            <div id="summary-modal-breadcrumb" class="stm-11">
              <div class="tooltip-wrapper stm-12">
                <button id="summary-modal-info-btn" type="button" aria-label="Describe what this flow is for and what you're trying to achieve, so Joe (AI) has context for the whole project (optional)" class="flowjoe-modal-control-btn stm-13">
                  <i class="fa-solid fa-info stm-14"></i>
                </button>
                <span class="tooltip-content">Describe what this flow is for and what you're trying to achieve, so Joe (AI) has context for the whole project (optional)</span>
              </div>
              
              <span class="summary-breadcrumb-segment summary-breadcrumb-active stm-15">Coastal Restoration Plan</span>
            </div>
            
            <div id="image-modal-notes-toolbar" class="stm-16">
              <span id="summary-modal-notes-label" class="stm-17"></span>
              
              
            </div>
            
            <div id="modal-notes-wrapper" class="stm-18">
              

              <div class="tiptap-flowjoe-container">
                
                
                <div class="tiptap-flowjoe-editor">
                  <div contenteditable="true" role="textbox" translate="no" class="tiptap ProseMirror" tabindex="0">
                    <p>Restore the North Cove dunes before the spring storms. The plan covers who plants what, where the native grasses go, and how the restoration is paid for.</p>
                    <ul>
                      <li><p>Volunteers sign up for Saturday planting shifts.</p></li>
                      <li><p>The shoreline survey sets the planting map.</p></li>
                      <li><p>Grants cover seedlings and fencing.</p></li>
                    </ul>
                  </div>
                </div>
                
                
              </div>
            </div>
            
            
            <div id="image-modal-footer-actions" class="stm-19">
              <div id="summary-modal-footer-meta" class="stm-20">
                
                
              </div>
              <div id="summary-modal-save-status" class="stm-21">
                <i class="far fa-clock" aria-hidden="true"></i>
                <span>Not saved yet • 343 characters</span>
              </div>
              <div id="image-modal-footer-button-group" class="stm-22">
                
                <button id="image-modal-cancel" tabindex="5" class="flowjoe-modal-control-btn stm-23">Cancel</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
